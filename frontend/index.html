<!DOCTYPE html>
<html lang="id"> 
 <head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  <!---mengatur agar tampilan web bersifat responsif menyesuaikan ukuran layar perangkat-->
    <title>KasirKu - Project LEPKOM</title> 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"> <!--mengimpor frameworl CSS bootsrap 5 via cdn untuk tata letak dan komponen visual-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"> <!--mengimpor pustaka ikon bootstrap icons-->
    <link rel="preconnect" href="https://fonts.googleapis.com"> <!--mengoptimalkan koneksi awal ke server google fonts-->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"> <!--mengimpor font family poppins dari google fonts-->
    <style> 
        body { font-family: 'Poppins', sans-serif; background-color: #f0f4f8; color: #333; } 
        .navbar-brand { font-weight: 700; color: #4f46e5; } 
        .product-card { background: #fff; border: none; border-radius: 16px; transition: all 0.3s ease; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); cursor: pointer; height: 100%; } 
        .product-img { width: 100%; height: 120px; object-fit: cover; border-radius: 12px; margin-bottom: 10px; } 
        .cart-container { background: #fff; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); height: calc(100vh - 120px); position: sticky; top: 20px; display: flex; flex-direction: column; } 
        .cart-header { background: #4f46e5; color: white; border-radius: 16px 16px 0 0 !important; padding: 20px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; } 
        .cart-body { flex-grow: 1; overflow-y: auto; padding: 20px; } 
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f1f5f9; } 
        .qty-btn { width: 28px; height: 28px; padding: 0; border-radius: 50% !important; display: flex; align-items: center; justify-content: center; font-weight: bold; } 
        .qty-text { width: 30px; text-align: center; font-weight: 600; } 
        .cart-item:last-child { border-bottom: none; } 
        .cart-footer { padding: 20px; background: #f8fafc; border-radius: 0 0 16px 16px; } 
        .btn-pay { background: #10b981; border: none; font-weight: 600; padding: 12px; border-radius: 12px; transition: background 0.3s; } 
        .btn-pay:hover { background: #059669; } 
        .input-pay { border-radius: 12px; padding: 12px; } 
    </style>
</head> 
<body>
    <nav class="navbar navbar-light bg-white shadow-sm mb-4"> 
        <div class="container-fluid px-4"> 
            <span class="navbar-brand mb-0 h1"><i class="bi bi-receipt-cutoff"></i> KasirKu - Project LEPKOM</span> 
            <div class="d-flex align-items-center gap-3"> 
                <a href="manage.html" class="btn btn-outline-primary btn-sm"><i class="bi bi-gear"></i> Kelola Produk</a> <!--tombol link menuju halaman manajemen produk-->
                <div class="d-flex align-items-center text-muted"> 
                    <i class="bi bi-person-circle fs-5 me-2"></i><span>Mrgood</span> 
                </div> 
            </div> 
        </div> 
    </nav> 

    <div class="container-fluid px-4"> 
        <div class="row"> 
            <div class="col-8"> 
                <h4 class="mb-3 text-muted">Pilih Produk</h4> 
                <div class="input-group mb-3"> 
                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span> 
                    <input type="text" id="search-product" class="form-control border-start-0" placeholder="Cari produk..."> 
                </div> 
                <div id="product-list" class="row g-3"></div> <!--container kosong ber id product-list tempat kartu produk di render-->
            </div> 

            <div class="col-4">
                <div class="cart-container">
                    <div class="cart-header">
                        <span><i class="bi bi-cart3"></i> Keranjang</span>
                        <span id="cart-count">0 Item</span>
                    </div>
                    <div class="cart-body" id="cart-list"></div> <!--container kosong ber id cart-list tempat item keranjang di render-->
                    <div class="cart-footer">
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Total Belanja</span>
                            <h5 class="fw-bold text-dark" id="total-price">Rp 0</h5> <!--teks total ber id total-price-->
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small">Uang Dibayar</label>
                            <input type="number" class="form-control input-pay" id="paid-amount" placeholder="Rp 0" oninput="calculateChange()"> <!--input untuk jumlah uang yang dibayarkan ber id paid-amount yang ototmatis memanggil fungsi calculatechange()-->
                        </div>
                        <div class="d-flex justify-content-between mb-3">
                            <span class="text-muted">Kembalian</span>
                            <h6 class="fw-bold text-success" id="change-amount">Rp 0</h6> <!--teks kembalian ber id change-amount-->
                        </div>
                        <button class="btn btn-success w-100 btn-pay" onclick="checkout()"><i class="bi bi-credit-card"></i> Bayar Sekarang</button> <!--tombol untuk melakukan pembayaran yang memanggil fungsi checkout()-->
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script> <!--mengimpor file javascript eksternal script.js yang berisi logika interaktif aplikasi kasir-->
</body>
</html>
