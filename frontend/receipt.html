<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Struk Transaksi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"> 
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet"><!--mengimpor font family Roboto Mono dari Google Fonts-->
    <style>
        body { background-color: #f0f4f8; display: flex; justify-content: center; padding-top: 40px; }
        .receipt-paper { background: #fff; width: 350px; padding: 25px; box-shadow: 0 0 15px rgba(0,0,0,0.1); font-family: 'Roboto Mono', monospace; }
        .text-center { text-align: center; }
        .line { border-top: 1px dashed #000; margin: 10px 0; }
        .item-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 5px; }
        @media print {
            body { background: none; padding: 0; }
            .no-print { display: none !important; }
            .receipt-paper { box-shadow: none; width: 100%; padding: 0; }
        }
    </style>
</head>
<body>
    <div>
        <div class="receipt-paper" id="receipt-content"></div>
        <div class="text-center mt-4 no-print">
            <button class="btn btn-primary" onclick="window.print()"><i class="bi bi-printer"></i> Print / Save as PDF</button> <!--tombol untuk mencetak struk atau menyimpannya sebagai PDF-->
            <a href="index.html" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Kembali ke Kasir</a> <!--tombol link kembali ke halaman kasir-->
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        async function printReceipt() {//fungsi untuk mengambil data struk dari server dan menampilkannya di halaman struk
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');

            const response = await fetch(`http://127.0.0.1:5000/api/receipt/${id}`);
            const data = await response.json();

            const header = data.header;
            const details = data.details;

            let itemsHtml = '';
            details.forEach(item => {
                itemsHtml += `
                    <div class="item-row">
                        <div>${item.name}</div>
                        <div>${item.quantity} x ${formatRupiah(item.price)}</div>
                    </div>
                    <div class="item-row" style="font-weight: bold; margin-top: -5px;">
                        <div></div>
                        <div>${formatRupiah(item.subtotal)}</div>
                    </div>
                `;
            });

            document.getElementById('receipt-content').innerHTML = `
                <div class="text-center">
                    <h5 class="fw-bold mb-0">KasirKu - Project LEPKOM</h5>
                    <p>Jl.in aja dulu<br>Universitas Gunadarma</p>
                </div>
                <div class="line"></div>
                <div style="font-size: 12px;">
                    No Trans: #${header.id}<br>
                    Tanggal : ${new Date(header.date).toLocaleString('id-ID')}<br>
                    Kasir   : Mrgood
                </div>
                <div class="line"></div>
                ${itemsHtml}
                <div class="line"></div>
                <div class="item-row" style="font-size: 16px; font-weight: bold;">
                    <div>TOTAL</div>
                    <div>${formatRupiah(header.total_price)}</div>
                </div>
                <div class="item-row">
                    <div>Tunai</div>
                    <div>${formatRupiah(header.paid_amount)}</div>
                </div>
                <div class="item-row" style="font-weight: bold;">
                    <div>Kembalian</div>
                    <div>${formatRupiah(header.change_amount)}</div>
                </div>
                <div class="line"></div>
                <div class="text-center mt-3" style="font-size: 12px;">
                    <p>Terima kasih atas kunjungan Anda!<br>Barang yang dibeli tidak dapat ditukar.</p>
                </div>
                <div class="line"></div>
            `;
        }
        printReceipt(); //memanggil fungsi printReceipt() untuk menampilkan struk saat halaman dimuat
    </script>
</body>
</html>
